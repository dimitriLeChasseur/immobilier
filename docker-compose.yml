# Audit Immobilier — stack auto-hébergée (VPS Contabo)
#
#   Démarrer :            docker compose up -d --build
#   + Studio (admin) :    docker compose --profile admin up -d
#   + SonarQube :         docker compose --profile quality up -d
#   Arrêter :             docker compose down
#
# Seul Caddy est exposé publiquement (80/443). Postgres, Studio et SonarQube
# n'écoutent que sur 127.0.0.1 : y accéder par tunnel SSH.
# Supabase est déployé en version allégée (Postgres/PostGIS, Auth, PostgREST,
# + Studio/Meta en option) : pas de Realtime, Storage, Edge Functions ni pooler.

name: immo

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:

  # --------------------------------------------------------------------------
  # Reverse proxy TLS (Let's Encrypt automatique) — unique point d'entrée
  # --------------------------------------------------------------------------
  caddy:
    container_name: immo-caddy
    image: caddy:2.11.6-alpine
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      backend:
        condition: service_healthy
      auth:
        condition: service_healthy
      rest:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80/tcp"
      - "${HTTPS_PORT:-443}:443/tcp"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      # Développement par défaut ; en production : CADDYFILE=./deploy/Caddyfile
      - ${CADDYFILE:-./infra/caddy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge

  # --------------------------------------------------------------------------
  # Backend FastAPI (ETL asynchrone)
  # --------------------------------------------------------------------------
  backend:
    container_name: immo-backend
    build:
      context: ./backend
    image: immo-backend:local
    restart: unless-stopped
    logging: *default-logging
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql://immo_app:${IMMO_APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      SUPABASE_JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # Facultatif : sans clé, les temps de marche sont estimés à vol d'oiseau.
      ORS_API_KEY: ${ORS_API_KEY:-}
      # Paiement Stripe : sans clés, les routes de paiement répondent 503.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRO_TAX_RATE_ID: ${STRIPE_PRO_TAX_RATE_ID:-}
      SITE_URL: ${SITE_URL}
      # Rapport d'exemple ouvert à tous (identifiant BAN) ; vide : aucun.
      DEMO_ADDRESS_ID: ${DEMO_ADDRESS_ID:-}
      # Suppression de compte en libre-service (appel d'administration interne).
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      # Alertes d'exploitation : sauvegarde ou test de fumée en échec.
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      # Envoi des reçus de paiement : même serveur SMTP que le service d'authentification.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-}
      SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-Audit Immobilier}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - edge
      - data

  # --------------------------------------------------------------------------
  # Supabase — PostgreSQL 17 + PostGIS
  # --------------------------------------------------------------------------
  db:
    container_name: immo-db
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    logging: *default-logging
    shm_size: 256m
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      # Superutilisateur requis : mots de passe des rôles réservés Supabase
      - ./infra/db/init/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro,Z
      - ./infra/db/init/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro,Z
      # Rôle applicatif + schéma + extensions (PostGIS) du projet
      - ./infra/db/init/immo.sql:/docker-entrypoint-initdb.d/init-scripts/99-zz-immo.sql:ro,Z
      # Schéma applicatif : cache des rapports, référentiels statiques, RLS
      - ./infra/db/init/init.sql:/docker-entrypoint-initdb.d/init-scripts/99-zzz-init.sql:ro,Z
      - ${DATA_DIR:-./data}/db:/var/lib/postgresql/data:Z
      # Persiste la clé de déchiffrement pgsodium entre les redémarrages
      - db-config:/etc/postgresql-custom
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      JWT_EXP: ${JWT_EXPIRY:-3600}
      IMMO_APP_DB_PASSWORD: ${IMMO_APP_DB_PASSWORD}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      [
        "postgres",
        "-c",
        "config_file=/etc/postgresql/postgresql.conf",
        "-c",
        "log_min_messages=warning"
      ]
    networks:
      - data

  # --------------------------------------------------------------------------
  # Supabase — Auth (GoTrue)
  # --------------------------------------------------------------------------
  auth:
    container_name: immo-auth
    image: supabase/gotrue:v2.196.0
    restart: unless-stopped
    logging: *default-logging
    <<: *hardening
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9999/health"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${PUBLIC_URL}/auth/v1

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}

      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}

      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${PUBLIC_URL}/auth/v1

      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      # Connexion Google : inactive tant que GOOGLE_ENABLED n'est pas à true.
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${PUBLIC_URL}/auth/v1/callback
      # En-tête envoyé par supabase-js, à autoriser puisque Caddy remplace la passerelle Kong.
      GOTRUE_CORS_ALLOWED_HEADERS: apikey,x-client-info,x-supabase-api-version
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-false}
      GOTRUE_PASSWORD_MIN_LENGTH: 12
      # Défi anti-robot (Cloudflare Turnstile) sur l'inscription, la connexion par mot de passe
      # et la demande de réinitialisation. À activer en même temps que la clé publique du site.
      GOTRUE_SECURITY_CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-false}
      GOTRUE_SECURITY_CAPTCHA_PROVIDER: turnstile
      GOTRUE_SECURITY_CAPTCHA_SECRET: ${CLOUDFLARE_TURNSTILE_SECRET_KEY:-}

      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-Audit Immobilier}
      # Messages à la charte du site : gabarits servis par le backend sur le réseau interne.
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://backend:8000/emails/confirmation.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://backend:8000/emails/recovery.html
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://backend:8000/emails/magic_link.html
      GOTRUE_MAILER_TEMPLATES_EMAIL_CHANGE: http://backend:8000/emails/email_change.html
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: "Confirmez votre adresse e-mail"
      GOTRUE_MAILER_SUBJECTS_RECOVERY: "Réinitialisez votre mot de passe"
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: "Votre lien de connexion"
      GOTRUE_MAILER_SUBJECTS_EMAIL_CHANGE: "Confirmez votre nouvelle adresse e-mail"
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
    networks:
      - edge
      - data

  # --------------------------------------------------------------------------
  # Supabase — API REST auto-générée (PostgREST), protégée par RLS
  # --------------------------------------------------------------------------
  rest:
    container_name: immo-rest
    image: postgrest/postgrest:v14.17
    restart: unless-stopped
    logging: *default-logging
    <<: *hardening
    read_only: true
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public}
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
      # Ne pas publier le schéma de la base aux clients anonymes
      PGRST_OPENAPI_MODE: disabled
    command: ["postgrest"]
    networks:
      - edge
      - data

  # --------------------------------------------------------------------------
  # Supabase — Studio + Meta (profil "admin", accès par tunnel SSH uniquement)
  # --------------------------------------------------------------------------
  meta:
    container_name: immo-meta
    image: supabase/postgres-meta:v0.99.0
    profiles: ["admin"]
    restart: unless-stopped
    logging: *default-logging
    <<: *hardening
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB:-postgres}
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
    networks:
      - data

  studio:
    container_name: immo-studio
    image: supabase/studio:2026.09.07-sha-7996410
    profiles: ["admin"]
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    depends_on:
      meta:
        condition: service_started
    ports:
      # Studio n'a pas d'authentification propre : ne jamais l'exposer publiquement
      - "127.0.0.1:${STUDIO_HOST_PORT:-3100}:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})\""
        ]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PORT: 5432
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public}
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      DEFAULT_ORGANIZATION_NAME: Audit Immobilier
      DEFAULT_PROJECT_NAME: immo
      SUPABASE_URL: http://caddy:80
      SUPABASE_PUBLIC_URL: ${PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      ENABLED_FEATURES_LOGS_ALL: "false"
    networks:
      - edge
      - data

  # --------------------------------------------------------------------------
  # SonarQube Community (profil "quality", accès par tunnel SSH uniquement)
  # Prérequis hôte : sysctl -w vm.max_map_count=524288
  # --------------------------------------------------------------------------
  sonar-db:
    container_name: immo-sonar-db
    image: postgres:17.11-alpine
    profiles: ["quality"]
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD}
      POSTGRES_DB: sonar
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sonar", "-d", "sonar"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - quality

  sonarqube:
    container_name: immo-sonarqube
    image: sonarqube:26.9.0.129388-community
    profiles: ["quality"]
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    depends_on:
      sonar-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SONAR_HOST_PORT:-9000}:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
    networks:
      - quality

networks:
  edge:
  data:
  quality:

volumes:
  db-config:
  caddy-data:
  caddy-config:
  sonar-db-data:
  sonar-data:
  sonar-extensions:
  sonar-logs:
