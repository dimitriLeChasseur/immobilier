# Intégration continue : style, typage et tests à chaque évolution de main.
# Aucun service payant : l'analyse SonarQube reste disponible en local (scripts/sonar-scan.sh).
# Le site n'est mis en ligne qu'une fois ces contrôles passés (tâche « deploy »).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Le moindre privilège suffit : le workflow ne fait que lire le dépôt. Les actions sont
# épinglées par empreinte de commit ; Dependabot (.github/dependabot.yml) les tient à jour.
permissions:
  contents: read

# Un nouveau push sur la même branche annule l'exécution précédente, devenue inutile.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Backend et frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configurer Python 3.11 et uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Installer les dépendances du backend
        working-directory: backend
        run: uv sync --frozen

      - name: Vérifier le style et le typage du backend
        working-directory: backend
        run: |
          uv run ruff check app tests
          uv run mypy app tests

      - name: Exécuter les tests unitaires (pytest)
        working-directory: backend
        env:
          # Valeurs factices : les tests n'ouvrent aucune connexion.
          DATABASE_URL: postgresql://test:test@localhost/test
          SUPABASE_JWT_SECRET: test
        # Seuil un peu sous la couverture mesurée (83 %) : il arrête une régression nette.
        run: uv run pytest --cov=app --cov-report=term --cov-fail-under=78

      # Scripts autonomes des cartes de bruit : leurs dépendances ne sont pas celles du backend.
      - name: Tester les scripts d'ingestion du bruit
        run: >
          uv run --no-project --python 3.11 --with pytest --with geopandas --with pyogrio
          --with requests --with sqlalchemy --with "psycopg[binary]" pytest scripts/tests -q

      - name: Configurer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Tester le frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run test -- --coverage
          npm run build

  integration:
    name: Requêtes SQL sur PostGIS
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configurer Python 3.11 et uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Installer les dépendances du backend
        working-directory: backend
        run: uv sync --frozen

      # Base jetable, créée pour cette exécution avec le schéma du dépôt : les secrets sont
      # générés sur place et disparaissent avec la machine.
      - name: Démarrer la base PostGIS
        run: |
          ./scripts/generate-env.sh
          docker compose up -d --wait db

      - name: Exécuter les tests d'intégration SQL
        working-directory: backend
        run: |
          password="$(grep '^IMMO_APP_DB_PASSWORD=' ../.env | cut -d= -f2-)"
          export IMMO_TEST_DATABASE_URL="postgresql://immo_app:${password}@127.0.0.1:5433/postgres"
          # Accès d'administration : sert uniquement à créer les comptes de test du paiement.
          admin="$(grep '^POSTGRES_PASSWORD=' ../.env | cut -d= -f2-)"
          export IMMO_TEST_ADMIN_DATABASE_URL="postgresql://supabase_admin:${admin}@127.0.0.1:5433/postgres"
          export DATABASE_URL="$IMMO_TEST_DATABASE_URL" SUPABASE_JWT_SECRET=test
          uv run pytest tests/test_integration_sql.py tests/test_integration_billing_sql.py -v

      - name: Afficher les journaux de la base en cas d'échec
        if: failure()
        run: docker compose logs db | tail -n 80

  # Parcours d'achat joué dans un navigateur, contre la pile réelle. Stripe et la Base Adresse
  # Nationale sont simulés : il ne dépend d'aucun service extérieur et conditionne la mise en
  # ligne. Les autres sources publiques restent appelées, mais leur panne ne le fait pas échouer.
  e2e:
    name: Parcours d'achat de bout en bout
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configurer Python 3.11 et uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Installer les dépendances du backend
        working-directory: backend
        run: uv sync --frozen

      - name: Configurer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer le frontend et le navigateur
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Démarrer la base, l'authentification et le proxy
        run: |
          ./scripts/generate-env.sh
          docker compose up -d --wait db auth backend caddy

      - name: Jouer le parcours d'achat
        working-directory: frontend
        run: npm run e2e

      - name: Conserver la capture en cas d'échec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-echec
          path: frontend/e2e-echec.png
          if-no-files-found: ignore

      - name: Afficher les journaux en cas d'échec
        if: failure()
        run: docker compose logs auth backend caddy | tail -n 120

  # Cloudflare Pages construit et publie le site à l'appel de ce crochet : ses déploiements
  # automatiques de la branche de production sont coupés, pour qu'un commit qui échoue aux
  # contrôles ne parte pas en ligne. Le backend, lui, se déploie à la main
  # (scripts/deploy-backend.sh).
  deploy:
    name: Mise en ligne du site
    needs: [tests, integration, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Demander le déploiement à Cloudflare Pages
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::Secret CLOUDFLARE_PAGES_DEPLOY_HOOK absent : aucun déploiement demandé."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --max-time 30 -X POST "$DEPLOY_HOOK" \
            -o /dev/null
          echo "Déploiement demandé pour le commit ${GITHUB_SHA::7}."
