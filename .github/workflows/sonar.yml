# Intégration continue : tests puis analyse SonarQube Cloud à chaque évolution de main.
#
# À configurer dans GitHub (Settings > Secrets and variables > Actions) :
#   Secrets   : SONAR_TOKEN, SONAR_HOST_URL (https://sonarcloud.io pour SonarQube Cloud)
#   Variables : SONAR_ORGANIZATION et SONAR_PROJECT_KEY (SonarQube Cloud uniquement ; sans elles,
#               la clé de sonar-project.properties est utilisée, ce qui convient à un serveur
#               SonarQube auto-hébergé)
name: Qualité (tests et Sonar)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Le moindre privilège suffit : le workflow ne fait que lire le dépôt.
permissions:
  contents: read

# Un nouveau push sur la même branche annule l'analyse précédente, devenue inutile.
concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: Tests et analyse
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          # Historique complet : Sonar en a besoin pour attribuer le « nouveau code ».
          fetch-depth: 0

      - name: Configurer Python 3.11 et uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Installer les dépendances du backend
        working-directory: backend
        run: uv sync --frozen

      - name: Vérifier le style et le typage du backend
        working-directory: backend
        run: |
          uv run ruff check app tests
          uv run mypy app tests

      - name: Exécuter les tests unitaires (pytest)
        working-directory: backend
        env:
          # Valeurs factices : les tests n'ouvrent aucune connexion.
          DATABASE_URL: postgresql://test:test@localhost/test
          SUPABASE_JWT_SECRET: test
        run: |
          uv run pytest --cov=app --cov-report=xml:coverage.xml
          # Chemins relatifs à la racine du dépôt, telle que la voit le scanner.
          sed -i -e 's|filename="|filename="backend/app/|' -e 's|<source>.*</source>|<source>.</source>|' coverage.xml

      - name: Configurer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Tester le frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npx vitest run --coverage --coverage.provider=v8 --coverage.reporter=lcov --coverage.include='src/**'
          sed -i 's|^SF:src/|SF:frontend/src/|' coverage/lcov.info

      - name: Vérifier la présence du jeton Sonar
        # Les secrets ne sont pas transmis aux pull requests venant d'un fork : on saute
        # alors l'analyse plutôt que de faire échouer la contribution.
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SONAR_TOKEN absent : analyse Sonar non exécutée."
          fi

      - name: Analyse Sonar
        if: ${{ steps.sonar.outputs.enabled == 'true' }}
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          # Le verdict du Quality Gate est attendu (sonar.qualitygate.wait dans
          # sonar-project.properties) : un Quality Gate rouge fait échouer le job.
          args: >
            ${{ vars.SONAR_ORGANIZATION && format('-Dsonar.organization={0}', vars.SONAR_ORGANIZATION) || '' }}
            ${{ vars.SONAR_PROJECT_KEY && format('-Dsonar.projectKey={0}', vars.SONAR_PROJECT_KEY) || '' }}
