# Mises à jour proposées chaque semaine, regroupées par écosystème pour limiter le bruit.
# Les correctifs de sécurité arrivent sans attendre, dans des demandes de fusion à part.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      # TypeScript 7 n'est pas encore accepté par typescript-eslint : npm ci échoue.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Les types de Node suivent la version utilisée par la CI, pas la dernière parue.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Une version majeure de la base ou de PostgREST se prépare à la main (sauvegarde,
      # essai sur une copie) : elle ne passe pas par une fusion automatique.
      - dependency-name: "supabase/postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "postgrest/postgrest"
        update-types: ["version-update:semver-major"]
