# Analyse SonarQube du dépôt (backend FastAPI + frontend Vue).
# Lancer : ./scripts/sonar-scan.sh  (génère la couverture puis exécute le scanner)

sonar.projectKey=audit-immobilier
sonar.projectName=Audit Immobilier
sonar.projectVersion=0.2.0
sonar.sourceEncoding=UTF-8

# --- Périmètre -------------------------------------------------------------
sonar.sources=backend/app,frontend/src,infra,scripts,docker-compose.yml,backend/Dockerfile
sonar.tests=backend/tests,frontend/tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/.venv/**,**/__pycache__/**,data/**
sonar.test.inclusions=backend/tests/**/*.py,frontend/tests/**/*.ts

# --- Python ----------------------------------------------------------------
sonar.python.version=3.11
sonar.python.coverage.reportPaths=backend/coverage.xml

# --- TypeScript / Vue ------------------------------------------------------
sonar.typescript.tsconfigPaths=frontend/tsconfig.app.json
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# --- Couverture ------------------------------------------------------------
# Hors couverture : points d'entrée et câblage (aucune logique), SQL d'initialisation,
# et composants de pure présentation, vérifiés par le parcours navigateur.
sonar.coverage.exclusions=backend/app/main.py,backend/app/container.py,backend/app/ingestion/__main__.py,\
  infra/**,scripts/**,docker-compose.yml,backend/Dockerfile,\
  frontend/src/main.ts,frontend/src/App.vue,frontend/src/components/**/*.vue,frontend/src/lib/pdf.ts

# --- Duplication -----------------------------------------------------------
# Les tests répètent volontairement des jeux de données : hors calcul de duplication.
sonar.cpd.exclusions=backend/tests/**,frontend/tests/**

# Le scanner attend le verdict du Quality Gate et échoue s'il est rouge.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# --- Exceptions documentées ------------------------------------------------
# Web:S6819 demande des éléments natifs à la place des rôles ARIA. La liste de suggestions
# d'adresses suit le modèle « combobox » du WAI-ARIA (role=listbox / role=option) : un
# <datalist> natif ne permet ni les deux lignes par suggestion, ni la navigation maîtrisée.
sonar.issue.ignore.multicriteria=aria1
sonar.issue.ignore.multicriteria.aria1.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.aria1.resourceKey=frontend/src/components/AddressSearch.vue
